# Publishes the public demo to GitHub Pages: the full app UI with no login, showing a daily snapshot of
# real SEC EDGAR data (financials, filings). No prices (market-data terms). No keys reach the site.
#
# Needs one repository secret: SEC_EDGAR_USER_AGENT = "Your Name your@email.com"
# (Settings → Secrets and variables → Actions). The SEC requires a contact on every request.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 11 * * *' # daily, 6–7 AM US Eastern
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Download SEC EDGAR snapshot
        run: npm run demo:snapshot -w server
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
      - run: npm run build -w web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_DEMO: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
